<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Christian Relationships: Youth Perspectives</title>
  <meta name="description" content="A short, honest survey on how Christian young people think about dating, courtship and marriage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header id="top" hidden>
      <div class="meta">
        <span id="section"></span>
        <span id="count"></span>
      </div>
      <div class="track" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
        <div class="fill" id="fill"></div>
      </div>
      <p class="cheer" id="cheer" aria-live="polite"></p>
    </header>

    <main id="screen" aria-live="polite">
      <noscript>This survey needs JavaScript to run. Please enable it and reload the page.</noscript>
    </main>

    <footer id="nav" hidden>
      <button type="button" class="btn ghost" id="back">Back</button>
      <button type="button" class="btn primary" id="next">Skip</button>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
